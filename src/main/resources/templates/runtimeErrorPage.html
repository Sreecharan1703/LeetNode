<!DOCTYPE html>
<!-- Add the Thymeleaf namespace -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error - LeetNode</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Favicon & Web Manifest -->
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#22c55e">

  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        const theme = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F5F9;
      --surface: #FFFFFF;
      --ink: #12141C;
      --muted: #5E6475;
      --line: #E1E3EC;
      --dot: rgba(18, 20, 28, 0.09);
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --accent-soft: rgba(34, 197, 94, 0.10);
      --on-accent: #FFFFFF;
      --danger: #D92D3A;
      --danger-ink: #A61B27;
      --danger-soft: rgba(217, 45, 58, 0.08);
      --danger-line: rgba(217, 45, 58, 0.28);
      --shadow: 0 1px 2px rgba(18, 20, 28, 0.04), 0 12px 32px -8px rgba(18, 20, 28, 0.10);
      --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0D0F16;
      --surface: #151824;
      --ink: #F2F3F8;
      --muted: #9AA1B5;
      --line: #272B3C;
      --dot: rgba(255, 255, 255, 0.07);
      --accent: #22c55e;
      --accent-hover: #4ade80;
      --accent-soft: rgba(34, 197, 94, 0.14);
      --on-accent: #0D0F16;
      --danger: #FF6B73;
      --danger-ink: #FFB3B8;
      --danger-soft: rgba(255, 107, 115, 0.10);
      --danger-line: rgba(255, 107, 115, 0.30);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px -8px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0D0F16;
        --surface: #151824;
        --ink: #F2F3F8;
        --muted: #9AA1B5;
        --line: #272B3C;
        --dot: rgba(255, 255, 255, 0.07);
        --accent: #22c55e;
        --accent-hover: #4ade80;
        --accent-soft: rgba(34, 197, 94, 0.14);
        --on-accent: #0D0F16;
        --danger: #FF6B73;
        --danger-ink: #FFB3B8;
        --danger-soft: rgba(255, 107, 115, 0.10);
        --danger-line: rgba(255, 107, 115, 0.30);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px -8px rgba(0, 0, 0, 0.55);
        color-scheme: dark;
      }
    }

    /* View Transition API: Round morph circular theme wipe */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) {
      z-index: 1;
    }
    ::view-transition-new(root) {
      z-index: 9999;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: transparent;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(60% 45% at 50% 0%, var(--accent-soft), transparent 70%),
        radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
      background-size: 100% 100%, 28px 28px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
    }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

    /* Site Header & Top Bar */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
      transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .site-header.is-scrolled {
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-bottom-color: var(--line);
      box-shadow: 0 4px 20px -2px rgba(18, 20, 28, 0.06);
    }
    [data-theme="dark"] .site-header.is-scrolled {
      box-shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.45);
    }

    .topbar {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: 10px clamp(16px, 2.5vw, 32px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      line-height: 0;
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand:hover {
      transform: scale(1.02);
    }
    .brand-logo {
      height: 38px;
      width: auto;
      display: block;
    }
    .brand-logo.logo-dark { display: none !important; }
    .brand-logo.logo-light { display: block !important; }

    [data-theme="dark"] .brand-logo.logo-dark { display: block !important; }
    [data-theme="dark"] .brand-logo.logo-light { display: none !important; }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .brand-logo.logo-dark { display: block !important; }
      :root:not([data-theme="light"]) .brand-logo.logo-light { display: none !important; }
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      padding: 3px 8px;
      border-radius: 9999px;
      letter-spacing: 0.02em;
      line-height: 1.2;
      user-select: none;
    }
    .brand-badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse-dot 2.5s infinite ease-in-out;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 3px;
      background: color-mix(in srgb, var(--surface) 75%, transparent);
      padding: 4px;
      border-radius: 9999px;
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(18, 20, 28, 0.03);
    }
    .nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
    }
    .nav-icon {
      width: 14px;
      height: 14px;
      opacity: 0.7;
      transition: transform 0.2s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }
    .nav a:hover {
      color: var(--ink);
      background: var(--surface);
    }
    .nav a:hover .nav-icon {
      opacity: 1;
      transform: scale(1.1);
    }
    .nav a[aria-current="page"] {
      background: var(--surface);
      color: var(--ink);
      font-weight: 600;
      border-color: color-mix(in srgb, var(--line) 90%, transparent);
      box-shadow: 0 1px 4px rgba(18, 20, 28, 0.08), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
    }
    .nav a[aria-current="page"] .nav-icon {
      opacity: 1;
      color: var(--accent);
    }

    .topbar-divider {
      width: 1px;
      height: 20px;
      background: var(--line);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .github-star-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 1px 2px rgba(18, 20, 28, 0.03);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      flex-shrink: 0;
    }
    .github-star-btn:hover {
      background: var(--surface-2);
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px var(--accent-soft);
    }
    .github-star-btn:active {
      transform: scale(0.96);
    }
    .github-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* Round Morph Theme Toggle Button */
    .theme-toggle-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 9999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      box-shadow: 0 1px 2px rgba(18, 20, 28, 0.04);
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--surface-2, #F0F1F7);
      border-color: var(--accent);
      color: var(--accent);
      transform: scale(1.08);
      box-shadow: 0 4px 14px var(--accent-soft);
    }

    .theme-toggle-btn:active {
      transform: scale(0.92);
    }

    .theme-toggle-icon {
      width: 19px;
      height: 19px;
      position: absolute;
      inset: 0;
      margin: auto;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }

    .theme-toggle-icon.sun-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    .theme-toggle-icon.moon-icon {
      opacity: 0;
      transform: scale(0.3) rotate(90deg);
    }

    [data-theme="dark"] .theme-toggle-icon.sun-icon {
      opacity: 0;
      transform: scale(0.3) rotate(-90deg);
    }

    [data-theme="dark"] .theme-toggle-icon.moon-icon {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle-icon.sun-icon {
        opacity: 0;
        transform: scale(0.3) rotate(-90deg);
      }
      :root:not([data-theme="light"]) .theme-toggle-icon.moon-icon {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    main { flex: 1; display: grid; place-items: center; padding: 20px; }

    .gaming-card {
      width: 100%;
      max-width: 520px;
      padding: clamp(28px, 6vw, 44px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }
    .error-icon {
      width: 56px; height: 56px;
      display: grid; place-items: center;
      margin-bottom: 22px;
      border-radius: 16px;
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: var(--danger);
    }
    h2 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
      line-height: 1.12;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }
    .error-lead { margin: 12px 0 0; color: var(--muted); }
    .error-message {
      margin: 14px 0 30px;
      padding: 16px 18px;
      border-radius: 14px;
      background: var(--danger-soft);
      border: 1px solid var(--danger-line);
      color: var(--danger-ink);
      font-size: 15px;
      overflow-wrap: anywhere;
    }
    .btn-outline {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 14px 26px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn-outline:hover { background: var(--accent-hover); }
    .btn-outline:active { transform: scale(0.98); }
    @media (max-width: 860px) {
      .brand-badge { display: none; }
    }
    @media (max-width: 680px) {
      .topbar { padding: 8px clamp(12px, 2.5vw, 20px); gap: 8px; }
      .brand-logo { height: 32px !important; }
      .github-star-btn .github-text { display: none; }
      .github-star-btn { padding: 7px; width: 34px; height: 34px; justify-content: center; }
      .nav a { padding: 5px 9px; font-size: 12.5px; gap: 4px; }
      .nav-icon { width: 13px; height: 13px; }
    }
    @media (max-width: 480px) {
      .topbar-divider { display: none; }
      .nav a span { display: none; }
      .nav a { padding: 7px; border-radius: 50%; }
      .nav-icon { width: 15px; height: 15px; }
      .theme-toggle-btn { width: 34px; height: 34px; }
      .btn-outline { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { .btn-outline { transition: none; } }
  </style>
</head>
<body>
<header class="site-header" id="top">
  <div class="topbar">
    <a class="brand" href="/" aria-label="LeetNode home">
      <img th:src="@{/images/leetnode-logo-light.svg}" src="/images/leetnode-logo-light.svg"
           alt="LeetNode" class="brand-logo logo-light">
      <img th:src="@{/images/leetnode-logo-dark.svg}" src="/images/leetnode-logo-dark.svg"
           alt="LeetNode" class="brand-logo logo-dark">
    </a>
    <div class="topbar-actions">
      <nav class="nav" aria-label="Main Navigation">
        <a href="/" th:href="@{/}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          <span>Home</span>
        </a>
        <a href="/rating" th:href="@{/rating}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/>
          </svg>
          <span>Predict</span>
        </a>
        <a href="/filter" th:href="@{/filter}">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
          </svg>
          <span>Filter</span>
        </a>
      </nav>
      <div class="topbar-divider" aria-hidden="true"></div>
      <a class="github-star-btn" href="https://github.com/Sreecharan1703/Leetcode_Rating_Predictor" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository" title="Star LeetNode on GitHub">
        <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span class="github-text">Star</span>
      </a>
      <button id="themeToggleBtn" class="theme-toggle-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg class="theme-toggle-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
          <line x1="12" y1="2" x2="12" y2="4.2"/>
          <line x1="12" y1="19.8" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93" x2="6.48" y2="6.48"/>
          <line x1="17.52" y1="17.52" x2="19.07" y2="19.07"/>
          <line x1="2" y1="12" x2="4.2" y2="12"/>
          <line x1="19.8" y1="12" x2="22" y2="12"/>
          <line x1="4.93" y1="19.07" x2="6.48" y2="17.52"/>
          <line x1="17.52" y1="6.48" x2="19.07" y2="4.93"/>
        </svg>
        <svg class="theme-toggle-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main>
  <div class="gaming-card">
    <div class="error-icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
    </div>
    <h2>You found a Wild Error!</h2>
    <p class="error-lead">An unexpected runtime exception occurred:</p>
    <div class="error-message" th:text="${error}">
      Default error message fallback
    </div>
    <a href="/" class="btn-outline">Return to Home</a>
  </div>
</main>

<script>
  // Manual Theme Toggle with View Transition API "Round Morph" Circle Expansion
  (function setupThemeToggle() {
    const toggleBtn = document.getElementById('themeToggleBtn');
    if (!toggleBtn) return;

    function updateAriaLabel(theme) {
      const nextMode = theme === 'dark' ? 'light' : 'dark';
      toggleBtn.setAttribute('aria-label', `Switch to ${nextMode} mode`);
      toggleBtn.setAttribute('title', `Switch to ${nextMode} mode`);
    }

    const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
    updateAriaLabel(initialTheme);

    toggleBtn.addEventListener('click', function(event) {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!document.startViewTransition || prefersReducedMotion) {
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
        updateAriaLabel(nextTheme);
        return;
      }

      const rect = toggleBtn.getBoundingClientRect();
      const x = event.clientX || (rect.left + rect.width / 2);
      const y = event.clientY || (rect.top + rect.height / 2);

      const endRadius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );

      const transition = document.startViewTransition(() => {
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
        updateAriaLabel(nextTheme);
      });

      transition.ready.then(() => {
        const clipPath = [
          `circle(0px at ${x}px ${y}px)`,
          `circle(${endRadius}px at ${x}px ${y}px)`
        ];

        document.documentElement.animate(
          {
            clipPath: clipPath
          },
          {
            duration: 480,
            easing: 'cubic-bezier(0.2, 0, 0, 1)',
            pseudoElement: '::view-transition-new(root)'
          }
        );
      });
    });
  })();

  // Sticky Header Elevation Observer
  (function setupHeaderScroll() {
    const header = document.querySelector('.site-header');
    if (!header) return;
    const updateHeader = () => {
      if (window.scrollY > 8) {
        header.classList.add('is-scrolled');
      } else {
        header.classList.remove('is-scrolled');
      }
    };
    window.addEventListener('scroll', updateHeader, { passive: true });
    updateHeader();
  })();
</script>
</body>
</html>
